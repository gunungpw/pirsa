[workspace]
members = [
    "crates/core",
    "crates/platform",
    "crates/ui",
]
resolver = "3"

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/gunungpw/pirsa"

[package]
name = "pirsa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Pirsa — a fast, keyboard-first Windows launcher built with Rust and iced"
license.workspace = true
repository.workspace = true

[[bin]]
name = "pirsa"
path = "src/main.rs"

[dependencies]
pirsa-core = { path = "crates/core" }
pirsa-platform = { path = "crates/platform" }
pirsa-ui = { path = "crates/ui" }
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "web-colors",
    "tokio",
    "crisp",
    "image-without-codecs",
] }
tokio = { version = "1", default-features = false, features = ["time"] }

[build-dependencies]
winres = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
