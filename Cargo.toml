[package]
name = "pirsa"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "Pirsa — a fast, keyboard-first Windows launcher built with Rust and iced"
license = "MIT"
repository = "https://github.com/gunungpw/pirsa"

[[bin]]
name = "pirsa"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "web-colors",
    "tokio",
    "crisp",
    "image-without-codecs",
] }
tokio = { version = "1", default-features = false, features = ["sync", "time"] }

[build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
