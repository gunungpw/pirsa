[workspace]
members = [
    "crates/core",
    "crates/platform",
    "crates/ui",
]
resolver = "3"

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/gunungpw/pirsa"

[workspace.dependencies]
pirsa-core = { path = "crates/core" }
pirsa-platform = { path = "crates/platform" }
pirsa-ui = { path = "crates/ui" }
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "web-colors",
    "tokio",
    "crisp",
    "image-without-codecs",
] }
tokio = { version = "1", default-features = false, features = [
    "sync",
    "time",
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[package]
name = "pirsa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Pirsa — a fast, keyboard-first Windows launcher built with Rust and iced"
license.workspace = true
repository.workspace = true

[[bin]]
name = "pirsa"
path = "src/main.rs"

[dependencies]
pirsa-core.workspace = true
pirsa-platform.workspace = true
pirsa-ui.workspace = true
iced.workspace = true
tokio.workspace = true

[build-dependencies]
winres = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
