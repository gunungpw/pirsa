# cargo-deny configuration.
# Run locally with `cargo deny check` (install: `cargo install cargo-deny`).

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
# Permissive licenses used by the Windows/iced dependency tree.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OFL-1.1",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
